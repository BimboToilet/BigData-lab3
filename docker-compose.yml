services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/lakehouse || true;
      /usr/bin/mc mb myminio/mlflow || true;
      /usr/bin/mc anonymous set public myminio/mlflow;
      exit 0;
      "

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: password

  mlflow:
    build: ./dockerfiles/mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    command: >
      mlflow server 
      --backend-store-uri postgresql://mlflow:password@db/mlflow
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
    depends_on:
      db:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  app:
    build: ./dockerfiles/app
    volumes:
      - ./src/app:/app/src
      - ./notebooks:/app/notebooks
      - ./data:/app/data
    environment:
      - S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: >
      sh -c "python src/main.py && 
             jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"
    ports:
      - "8888:8888"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started